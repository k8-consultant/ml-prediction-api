name: ML Prediction API CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write
  security-events: write


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run tests
        run: |
          python -m pytest -v


  build-and-push:

    needs: test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }} \
            .

      - name: vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }}
          format: sarif
          output: trivy-report.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Trivy report
        uses: github/codeql-action/upload-sarif@v3
        with:
          name: sarif-report
          sarif_file: trivy-report.sarif

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }}
