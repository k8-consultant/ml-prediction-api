  update-gitops:
    needs: build-and-push

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Update GitOps rollout image
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          echo "Authenticated user:"
          gh api user --jq '.login'

          echo "Getting current rollout.yaml..."

          FILE_DATA=$(gh api \
            repos/k8-consultant/ml-prediction-gitops/contents/environments/dev/rollout.yaml \
            --jq '{content: .content, sha: .sha}')

          CURRENT_SHA=$(echo "$FILE_DATA" | jq -r '.sha')

          echo "$FILE_DATA" \
            | jq -r '.content' \
            | base64 --decode \
            > rollout.yaml

          echo "Updating image tag..."

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("rollout.yaml")
          sha = os.environ["IMAGE_SHA"]

          content = path.read_text()

          pattern = (
              r'image:\s*ghcr\.io/k8-consultant/'
              r'ml-prediction-api:\S+'
          )

          replacement = (
              f'image: ghcr.io/k8-consultant/'
              f'ml-prediction-api:{sha}'
          )

          updated, count = re.subn(
              pattern,
              replacement,
              content,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "Could not find ml-prediction-api image"
              )

          path.write_text(updated)

          print(
              f"Updated image to "
              f"ghcr.io/k8-consultant/"
              f"ml-prediction-api:{sha}"
          )
          PY

          echo "Encoding updated file..."

          UPDATED_CONTENT=$(base64 -w 0 rollout.yaml)

          echo "Updating GitOps repository..."

          gh api \
            --method PUT \
            repos/k8-consultant/ml-prediction-gitops/contents/environments/dev/rollout.yaml \
            -f message="Deploy ml-prediction-api ${IMAGE_SHA}" \
            -f content="${UPDATED_CONTENT}" \
            -f sha="${CURRENT_SHA}" \
            -f branch="main"

          echo "GitOps repository updated successfully"
