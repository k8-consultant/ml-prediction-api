name: ML Prediction API CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write
  security-events: write


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run tests
        run: |
          python -m pytest -v


  build-and-push:

    needs: test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }} \
            .

      - name: vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }}
          format: sarif
          output: trivy-report.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Trivy report
        uses: github/codeql-action/upload-sarif@v3
        with:
          name: sarif-report
          sarif_file: trivy-report.sarif

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }}
  
  upadate-gitops:

    needs: build-and-push

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: k8-consultant/ml-prediction-gitops
          token: ${{ secrets.GITHUB_TOKEN }}
          path: gitops

      - name: Update image tag in rollout.yaml
        run: |
          
          sed -i "s|image: ghcr.io/k8-consultant/ml-prediction-api:.*|image: ghcr.io/k8-consultant/ml-prediction-api:${{ github.sha }}|"\
          gitops/environments/dev/rollout.yaml
      - name: Commit and push changes
        run: |
          cd gitops
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add environments/dev/rollout.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update image tag to ${{ github.sha }}"
            git push origin main
          fi
      
