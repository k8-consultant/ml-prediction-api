
name: ML Prediction API CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write
  security-events: write


jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout application repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run tests
        run: |
          python -m pytest -v


  build-and-push:
    needs: test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout application repository
        uses: actions/checkout@v4


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }} \
            .


      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }}
          format: sarif
          output: trivy-report.sarif
          severity: HIGH,CRITICAL
          exit-code: 0


      - name: Upload Trivy report
        uses: github/codeql-action/upload-sarif@v3
        with:
          name: trivy-sarif-report
          sarif_file: trivy-report.sarif


      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ml-prediction-api:${{ github.sha }}


  update-gitops:
    needs: build-and-push

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: k8-consultant/ml-prediction-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          persist-credentials: false


      - name: Verify GitOps token
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          echo "Authenticated GitHub user:"
          gh api user --jq '.login'

          echo "Permissions seen by this token:"
          gh api repos/k8-consultant/ml-prediction-gitops --jq '.permissions'

          echo "GitOps repository status:"
          cd gitops
          git status

          echo "Current directory:"
          pwd

          echo "Remote:"
          git remote -v

          echo "Current branch:"
          git branch --show-current


      - name: Update image tag in rollout.yaml
        working-directory: gitops
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("environments/dev/rollout.yaml")
          sha = os.environ["IMAGE_SHA"]

          content = path.read_text()

          pattern = (
              r'image:\s*ghcr\.io/k8-consultant/'
              r'ml-prediction-api:\S+'
          )

          replacement = (
              f'image: ghcr.io/k8-consultant/'
              f'ml-prediction-api:{sha}'
          )

          updated_content, count = re.subn(
              pattern,
              replacement,
              content,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: Could not find ml-prediction-api image "
                  "inside environments/dev/rollout.yaml"
              )

          path.write_text(updated_content)

          print("Updated image to:")
          print(
              f"ghcr.io/k8-consultant/"
              f"ml-prediction-api:{sha}"
          )
          PY


      - name: Show GitOps change
        working-directory: gitops
        run: |
          git diff -- environments/dev/rollout.yaml


      - name: Commit and push GitOps change
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add environments/dev/rollout.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit"
          else
            git commit -m "Update image tag to ${{ github.sha }}"

            echo "Configure Git authentication using GitHub CLI"
            gh auth setup-git

            echo "Reset remote URL"
            git remote set-url origin \
              https://github.com/k8-consultant/ml-prediction-gitops.git

            echo "Test authenticated access"
            git ls-remote origin HEAD

            echo "Push GitOps update to main"
            git push origin HEAD:main
          fi